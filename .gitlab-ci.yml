# Agentic AI - GitLab CI/CD Pipeline
# Version: 0.7.0
# Last Updated: April 16, 2026

stages:
  - lint
  - test
  - build
  - security
  - deploy
  - lab

# ============================================
# Variables
# ============================================
variables:
  PYTHON_VERSION: "3.12"

# ============================================
# Lint Stage
# ============================================
lint:
  stage: lint
  image: python:${PYTHON_VERSION}-slim
  allow_failure: true
  script:
    - pip install flake8 black isort mypy
    - flake8 agentic_ai/ --max-line-length=120 --exclude=venv,__pycache__ --extend-ignore=E128,E741
    - black --check agentic_ai/ tests/ || true
    - isort --check-only agentic_ai/ tests/ || true
    - mypy agentic_ai/ --ignore-missing-imports || true
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == "main"

# ============================================
# Test Stage
# ============================================
test:
  stage: test
  image: python:${PYTHON_VERSION}-slim
  services:
    - name: redis:7-alpine
      alias: redis
  before_script:
    - apt-get update && apt-get install -y gcc
    - python -m venv venv
    - source venv/bin/activate
    - pip install --upgrade pip
    - pip install -r requirements.txt
  script:
    - pytest tests/ -v --tb=short --cov=agentic_ai --cov-report=xml --cov-report=html
    - coverage report --fail-under=75
  artifacts:
    reports:
      coverage_report:
        coverage_format: cobertura
        path: coverage.xml

# KA-INT-2: the offline battery (cve-db staleness + catalog links +
# proposals) - never touches the network or the lab
ka-battery:
  stage: test
  image: python:${PYTHON_VERSION}-slim
  before_script:
    - apt-get update && apt-get install -y gcc
    - python -m venv venv
    - source venv/bin/activate
    - pip install --upgrade pip
    - pip install -r requirements.txt
  script:
    - python scripts/ka/cve_db_check.py
    - python scripts/ka/catalog_check.py
    - python scripts/ka/cve_db_propose.py --feed tests/fixtures/scans/kevstig_coverage_snapshot.json --queue /tmp/ka-review-$CI_PIPELINE_ID.md
  artifacts:
    paths:
      - htmlcov/
    expire_in: 1 week
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == "main"

# ============================================
# Build Stage
# ============================================
build:
  stage: build
  image: docker:29
  services:
    - docker:29-dind
  before_script:
    # $CI_REGISTRY, $CI_REGISTRY_IMAGE, $CI_REGISTRY_USER and
    # $CI_REGISTRY_PASSWORD are GitLab-provided: the push target is
    # always this instance's container registry, no hardcoded host.
    - echo "$CI_REGISTRY_PASSWORD" | docker login -u "$CI_REGISTRY_USER" --password-stdin "$CI_REGISTRY"
  script:
    - docker build -t "$CI_REGISTRY_IMAGE:$CI_COMMIT_SHA" -t "$CI_REGISTRY_IMAGE:latest" .
    - docker push "$CI_REGISTRY_IMAGE:$CI_COMMIT_SHA"
    - docker push "$CI_REGISTRY_IMAGE:latest"
  rules:
    - if: $CI_COMMIT_BRANCH == "main"
    - if: $CI_COMMIT_TAG

# ============================================
# Security Scan Stage
# ============================================
security-scan:
  stage: security
  image: python:${PYTHON_VERSION}-slim
  script:
    - pip install bandit safety
    - bandit -r agentic_ai/ -f json -o bandit-report.json || true
    - safety check --json > safety-report.json || true
  artifacts:
    reports:
      sast: bandit-report.json
    paths:
      - bandit-report.json
      - safety-report.json
    expire_in: 4 weeks
  rules:
    - if: $CI_COMMIT_BRANCH == "main"
  allow_failure: true

# ============================================
# Deploy - Development
# ============================================
deploy-dev:
  stage: deploy
  image: bitnami/kubectl:latest
  script:
    - kubectl config use-context dev-cluster
    - kubectl set image deployment/agentic-ai agentic-ai=$CI_REGISTRY_IMAGE:$CI_COMMIT_SHA -n agentic-ai-dev
    - kubectl rollout status deployment/agentic-ai -n agentic-ai-dev
  environment:
    name: development
    url: https://dev.agentic-ai.example.com
  rules:
    - if: $CI_COMMIT_BRANCH == "develop"

# ============================================
# Deploy - Staging
# ============================================
deploy-staging:
  stage: deploy
  image: bitnami/kubectl:latest
  script:
    - kubectl config use-context staging-cluster
    - kubectl set image deployment/agentic-ai agentic-ai=$CI_REGISTRY_IMAGE:$CI_COMMIT_SHA -n agentic-ai-staging
    - kubectl rollout status deployment/agentic-ai -n agentic-ai-staging
  environment:
    name: staging
    url: https://staging.agentic-ai.example.com
  rules:
    - if: $CI_COMMIT_BRANCH == "main"
    - if: $CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+$/
  when: manual

# ============================================
# Deploy - Production
# ============================================
deploy-prod:
  stage: deploy
  image: bitnami/kubectl:latest
  script:
    - kubectl config use-context prod-cluster
    - kubectl set image deployment/agentic-ai agentic-ai=$CI_REGISTRY_IMAGE:$CI_COMMIT_SHA -n agentic-ai
    - kubectl rollout status deployment/agentic-ai -n agentic-ai
  environment:
    name: production
    url: https://agentic-ai.example.com
  rules:
    - if: $CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+$/
  when: manual
  needs:
    - build
    - security-scan

# ============================================
# KA-097 additions (PROPOSAL block)
# Integrator note: merge `lab` into the root stages list; these two jobs
# own the test + lab stages only.
# ============================================

# ============================================
# KA-097: the pytest suite gate
# ============================================
pytest-suite:
  stage: test
  image: python:${PYTHON_VERSION}-slim
  before_script:
    - apt-get update && apt-get install -y gcc
    - python -m venv venv
    - source venv/bin/activate
    - pip install --upgrade pip
    - pip install -r requirements.txt
  script:
    - cd "$CI_PROJECT_DIR"
    - set -o pipefail
    - python3 -m pytest tests/ -q 2>&1 | tee pytest-verdict.log
    - grep -E "[0-9]+ (passed|failed|error)" pytest-verdict.log
    - python3 -m pytest tests/ -q -k "purity" 2>&1 | tee purity-scan.log
    - grep -E "[0-9]+ (passed|failed|error)" purity-scan.log
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == "main"
  artifacts:
    when: always
    paths:
      - pytest-verdict.log
      - purity-scan.log
    expire_in: 1 day
  timeout: 30m
  retry:
    max: 2
    when: always

# ============================================
# KA-097: the KA-009 lab battery - MANUAL ONLY
# compose up -> consent-gated pytest -> down -v
# ============================================
lab-battery:
  stage: lab
  image: python:${PYTHON_VERSION}-slim
  services:
    - docker:29-dind
  variables:
    DOCKER_HOST: tcp://docker:2375
    DOCKER_TLS_CERTDIR: ""
  # The lab consent gate is a protected CI/CD variable (Settings > CI/CD >
  # Variables, marked Protected; Masked where GitLab allows), referenced
  # BY NAME below. NEVER inline its value in this file.
  before_script:
    - apt-get update && apt-get install -y gcc docker.io docker-compose-v2
    - python -m venv venv
    - source venv/bin/activate
    - pip install --upgrade pip
    - pip install -r requirements.txt
  script:
    - cd "$CI_PROJECT_DIR"
    # consent refusal FIRST: a manual run without the protected consent
    # variables aborts before anything lab-touching starts
    - test "${KA_LAB_BATTERY}" = "1"
    - docker info
    - docker compose version
    - docker compose -f docker/lab-targets/docker-compose.yml up -d
    - docker compose -f docker/lab-targets/docker-compose.yml ps
    - python3 -m pytest tests/lab -q 2>&1 | tee lab-battery.log
    - grep -E "[0-9]+ (passed|failed|error)" lab-battery.log
  after_script:
    # teardown ALWAYS: down -v is the documented reset between runs
    - docker compose -f docker/lab-targets/docker-compose.yml down -v || true
  rules:
    # manual in every pipeline shape: never automatic, only owner-clicked
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      when: manual
    - if: $CI_COMMIT_BRANCH == "main"
      when: manual
  allow_failure: false
  artifacts:
    when: always
    paths:
      - lab-battery.log
    expire_in: 1 day
  timeout: 45m
