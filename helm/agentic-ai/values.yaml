# Default values for Agentic AI
# This is a YAML-formatted file.

# Replica count
replicaCount: 3

# Image configuration
# The repository CI pushes to is $CI_REGISTRY_IMAGE (GitLab registry,
# i.e. <registry>/crab-meat-repos/agentic-ai). Point this at your registry,
# e.g. helm install --set image.repository=$CI_REGISTRY_IMAGE.
image:
  repository: registry.example.internal/crab-meat-repos/agentic-ai
  pullPolicy: IfNotPresent
  # Empty tag falls back to Chart appVersion (kept in sync with pyproject.toml)
  tag: ""

# Image pull secrets
imagePullSecrets: []

# Deployment name override
nameOverride: ""
fullnameOverride: ""

# Service account configuration
serviceAccount:
  create: true
  annotations: {}
  name: ""

# Pod annotations
podAnnotations: {}

# Pod security context
podSecurityContext: {}

# Security context
securityContext: {}

# Service configuration
service:
  type: ClusterIP
  port: 8000
  targetPort: 8000

# Ingress configuration
ingress:
  enabled: false
  className: ""
  annotations: {}
  hosts:
    - host: agentic-ai.local
      paths:
        - path: /
          pathType: Prefix
  tls: []

# Resource limits and requests
resources:
  limits:
    cpu: 2000m
    memory: 2048Mi
  requests:
    cpu: 500m
    memory: 512Mi

# Autoscaling configuration
autoscaling:
  enabled: true
  minReplicas: 3
  maxReplicas: 10
  targetCPUUtilizationPercentage: 80
  targetMemoryUtilizationPercentage: 80

# Node selector
nodeSelector: {}

# Tolerations
tolerations: []

# Affinity rules
affinity: {}

# Redis / PostgreSQL are NOT deployed by this chart (there are no subchart
# dependencies). Point the URLs below at services you provide. The old
# redis:/postgresql: sections configured subcharts that were never wired
# into Chart.yaml and rendered nothing — removed.

# Environment variables
env:
  # agentic_ai reads REDIS_URL (infrastructure/config.py RedisConfig)
  REDIS_URL: "redis://agentic-ai-redis:6379"
  # DATABASE_URL example for an external PostgreSQL:
  # DATABASE_URL: "postgresql://postgres:<password>@agentic-ai-postgresql:5432/agentic_ai"
  LOG_LEVEL: "INFO"
  API_HOST: "0.0.0.0"
  API_PORT: "8000"

# ConfigMap for additional configuration
config:
  secretKey: "change-me-in-production"
  jwtExpiry: 3600
  maxRetries: 3
  taskTimeout: 300

# Prometheus metrics
prometheus:
  enabled: true
  port: 9090
  scrapeInterval: 15s

# Grafana dashboard
grafana:
  enabled: true
  dashboards:
    - name: "Agentic AI Overview"
      uid: "agentic-ai-overview"
    - name: "Agent Metrics"
      uid: "agent-metrics"
    - name: "Chaos Engineering"
      uid: "chaos-engineering"

# Liveness and readiness probes
livenessProbe:
  httpGet:
    path: /health
    port: 8000
  initialDelaySeconds: 30
  periodSeconds: 10
  timeoutSeconds: 5
  failureThreshold: 3

readinessProbe:
  httpGet:
    path: /health
    port: 8000
  initialDelaySeconds: 5
  periodSeconds: 5
  timeoutSeconds: 3
  failureThreshold: 3

# Volume mounts
volumes: []
volumeMounts: []

# Additional containers
additionalContainers: []

# Init containers
initContainers: []

# Pod disruption budget
podDisruptionBudget:
  enabled: true
  minAvailable: 2

# Network policy
networkPolicy:
  enabled: false
  allowExternal: true
